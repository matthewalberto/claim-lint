name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with YAML support)
        run: pip install ".[yaml]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The example draft is blocked
        run: |
          set +e
          claim-lint --rules examples/rules.example.md --file examples/draft.md
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi
      - name: Clean text passes
        run: echo "Our tool helps your team spot issues early." | claim-lint --rules examples/rules.example.md
